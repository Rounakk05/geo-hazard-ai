[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geohazard"
version = "0.1.0"
description = "Geospatial AI Framework for Multi-Hazard Disaster Detection and Damage Assessment"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Anmol Badoni"},
    {name = "Nikunj Kaushik"},
    {name = "Rounak Khurana"},
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]
